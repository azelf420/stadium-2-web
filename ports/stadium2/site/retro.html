<script>
  // The ROM address given once (?rom=<url>) or saved earlier: the page downloads it here, with progress, and the game
  // takes the bytes when it starts (main.cpp waits on n64webRomState).
  (function () {
    let url = '';
    try {
      const q = new URLSearchParams(location.search).get('rom');
      if (q) {
        localStorage.setItem('n64web-rom', q);
        const u = new URL(location.href); u.searchParams.delete('rom');
        history.replaceState(null, '', u.pathname + u.search);
      }
      url = q || localStorage.getItem('n64web-rom') || '';
    } catch (e) {}
    if (!url || !window.crossOriginIsolated || !navigator.gpu) return;
    const pt = /^pt/i.test(navigator.language || '');
    // The status line also carries the page's errors (red): never write over one.
    const say = (text) => { const st = document.getElementById('status'); if (st && !st.style.color) st.textContent = text; };
    globalThis.n64webRomState = 'loading';
    fetch(url).then(async (r) => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const total = +r.headers.get('content-length') || 0, reader = r.body.getReader(), parts = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value); got += value.length;
        if (total) say((pt ? 'Baixando a ROM ' : 'Downloading the ROM ') + Math.floor(got * 100 / total) + '%');
      }
      const rom = new Uint8Array(got); let at = 0;
      for (const part of parts) { rom.set(part, at); at += part.length; }
      globalThis.n64webRom = rom; globalThis.n64webRomState = 'done';
      say(pt ? 'ROM pronta. Iniciando o jogo...' : 'ROM ready. Starting the game...');
      // The game clears the status line once it runs. Still there after 90 s: it most likely ran out of memory.
      setTimeout(() => {
        const st = document.getElementById('status');
        if (st && st.textContent && !st.style.color) {
          st.style.color = '#f88';
          st.textContent = pt
            ? 'O jogo não iniciou. Este aparelho provavelmente não tem memória suficiente (o jogo usa cerca de 1,5 GB). Num computador com Chrome ou Edge ele roda.'
            : 'The game did not start. This device most likely ran out of memory (the game uses about 1.5 GB). It runs on a computer with Chrome or Edge.';
        }
      }, 90000);
    }).catch((e) => { console.log('[n64web] ROM download failed: ' + e); globalThis.n64webRomState = 'error'; });
  })();
</script>

          options: 'OPTIONS', full: 'FULLSCREEN', hide: 'HIDE PANEL', pad: '🎮 USB and Bluetooth controllers are detected automatically: plug one in and press a button.', visits1: 'You have been here', visits2: 'times',
          online: 'ONLINE MODE', new: 'NEW!', create: 'CREATE ROOM', join: 'JOIN', code: 'CODE',
          onlinenote: '2 player battles over the internet. Whoever creates the room is player 1 and sends the link to a friend. The game starts over on both.',
          rom: 'Bring your own ROM. No game files are hosted on this site.' },
  }[n64Lang];
  document.documentElement.lang = n64Lang === 'pt' ? 'pt-BR' : 'en';
  window.addEventListener('DOMContentLoaded', () => {
    const st = document.getElementById('status');
    if (!st || !st.style.color || n64Lang !== 'pt') return;
    if (/no WebGPU/.test(st.textContent)) st.textContent = 'Este navegador não tem WebGPU. No computador use Chrome ou Edge atualizado; no celular, Chrome atualizado no Android ou Safari no iOS 26.';
    else if (/cross-origin isolation/.test(st.textContent)) st.textContent = 'Recarregue a página uma vez (a página precisa se reabrir para liberar as threads do jogo).';
  });
  document.querySelectorAll('[data-t]').forEach((e) => { e.textContent = n64Text[e.dataset.t]; });
  document.querySelectorAll('[data-p]').forEach((e) => { e.placeholder = n64Text[e.dataset.p]; });
  // Panel behaviour: show/hide (the canvas takes the freed width; SDL follows the window's resize), fullscreen, and a
  // visit count kept in this browser only. Nothing here takes the keyboard from the game.
  function n64Panel(on) {
    document.body.classList.toggle('n64-panel', on);
    try { localStorage.setItem('n64web-panel', on ? '1' : '0'); } catch (e) {}
    setTimeout(() => { window.dispatchEvent(new Event('resize')); document.getElementById('canvas').focus(); }, 0);
  }

    const c = document.getElementById('canvas');

  }

    let show = true, visits = 1;
    try {
      const stored = localStorage.getItem('n64web-panel');
      show = stored === null ? !matchMedia('(pointer: coarse)').matches : stored !== '0';
      visits = (parseInt(localStorage.getItem('n64web-visits') || '0', 10) || 0) + 1;
      localStorage.setItem('n64web-visits', String(visits));
    } catch (e) {}
    document.body.classList.toggle('n64-panel', show);
    document.getElementById('n64-visits').textContent = String(visits).padStart(6, '0');
  })();

  // (Module._n64web_net_remote). A room server pairs the pages by a 4 letter code and passes their WebRTC setup along
  // (server/rooms.py), and carries the game packets itself when the browsers can't connect directly.

    if (code !== 'NEW' && !/^[A-Z0-9]{4}$/.test(code)) { document.getElementById('n64-code').focus(); return; }
    const u = new URL(location.href); u.searchParams.set('online', code === 'NEW' ? 'new' : code);

      leave: 'SAIR DO ONLINE', ping: 'ping', nogame: 'Esta versão da página não tem o modo online.', room: 'SALA',
    } : {

    let isHost = want === 'NEW', code = isHost ? (q.get('room') || '').toUpperCase() : want, delay = 4, rtt = 0;
    // This page's inputs (frame -> buttons, x, y) and what the partner has acknowledged; the partner's, delivered.
    const lf = new Int32Array(HIST).fill(-1), lb = new Uint16Array(HIST), lx = new Float32Array(HIST), ly = new Float32Array(HIST);

    }
    // Every packet carries this page's inputs from the first one the partner hasn't acknowledged (at most 32 frames),
    // and the last partner frame this page has, so a lost packet is simply sent again in the next one.
    function sendInputs() {
      if (!live) return;
      const first = Math.max(peerAck + 1, delay, localMax - MAX_SEND + 1);
      const n = localMax - first + 1;
      const v = new DataView(new ArrayBuffer(12 + Math.max(n, 0) * 10));
      v.setUint32(0, PKT_INPUT, true); v.setInt32(4, remoteNext - 1, true); v.setInt32(8, first, true);
      for (let k = 0; k < n; k++) {
        const i = (first + k) % HIST, o = 12 + k * 10;
        v.setUint16(o, lb[i], true); v.setFloat32(o + 2, lx[i], true); v.setFloat32(o + 6, ly[i], true);
      }
      sendRaw(v.buffer); lastSend = performance.now();
    }
    function onGamePacket(buf) {
      if (!live || !(buf instanceof ArrayBuffer) || buf.byteLength < 12) return;
      const v = new DataView(buf), type = v.getUint32(0, true);
      if (type === PKT_HASH && buf.byteLength >= 16) { peerHash.set(v.getUint32(4, true), v.getUint32(8, true) + ':' + v.getUint32(12, true)); checkHashes(); return; }
      if (type !== PKT_INPUT) return;
      peerAck = Math.max(peerAck, v.getInt32(4, true));
      const first = v.getInt32(8, true), n = (buf.byteLength - 12) / 10 | 0, M = game();
      for (let k = 0; k < n; k++) {
        const f = first + k, i = f % HIST, o = 12 + k * 10;
        if (f < remoteNext || rf[i] === f) continue;
        rf[i] = f;
        M._n64web_net_remote(f, v.getUint16(o, true), v.getFloat32(o + 2, true), v.getFloat32(o + 6, true));
      }
      while (rf[remoteNext % HIST] === remoteNext) remoteNext++;
    }
    function checkHashes() {
      for (const [vi, h] of ownHash) {
        if (!peerHash.has(vi)) continue;
        if (peerHash.get(vi) !== h && !error) { console.log('[net] desync at frame ' + vi); stop(); say(L.desync(vi), true); }
        ownHash.delete(vi); peerHash.delete(vi);
      }
      if (peerHash.size > 600) peerHash.clear();
    }
    function stop() { live = false; const M = game(); if (M) M._n64web_net_end(); }

    // ---- room server and the direct connection
    const sendCtl = (obj) => {
      const s = JSON.stringify(obj);
      if (relay) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'ctl', data: s })); }
      else if (ctl && ctl.readyState === 'open') ctl.send(s);
    };
    function connectServer() {
      const url = q.get('signal') || globalThis.n64webSignal || '';
      if (!url) { say(L.noserver, true); return; }
      say(L.server);
      ws = new WebSocket(url); ws.binaryType = 'arraybuffer';
      ws.onopen = () => ws.send(JSON.stringify(isHost ? { t: 'create', code } : { t: 'join', code }));
      ws.onerror = () => { if (!connected) say(L.noserver, true); };
      ws.onclose = () => { if (!connected && !error) say(L.noserver, true); };
      ws.onmessage = (e) => {
        if (e.data instanceof ArrayBuffer) { onGamePacket(e.data); return; }
        const m = JSON.parse(e.data);
        if (m.t === 'created') {
          code = m.code;
          const link = location.origin + location.pathname + '?online=' + code;
          head = `${L.room} <span class="code">${code}</span>`; foot = L.you1;
          body = `<div>${L.created}</div><div class="link"><input id="n64-net-url" readonly value="${esc(link)}"><button class="n64-b3" id="n64-net-copy">${L.copy}</button></div>`;
          draw();
        } else if (m.t === 'joined') { code = m.code; head = `${L.room} <span class="code">${code}</span>`; say(L.peer); peerUp(); }
        else if (m.t === 'peer-joined') { say(L.peer); peerUp(); }
        else if (m.t === 'peer-left') { if (live) { stop(); say(L.left, true); } else say(L.left, true); }
        else if (m.t === 'error') say(m.msg === 'no-room' ? L.noroom : m.msg === 'room-full' ? L.full : L.noserver, true);
        else if (m.t === 'signal') onSignal(m.data);
        else if (m.t === 'ctl') onCtl(m.data);
      };
    }
    function peerUp() {
      pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      pc.onicecandidate = (e) => { if (e.candidate) ws.send(JSON.stringify({ t: 'signal', data: { ice: e.candidate } })); };
      pc.oniceconnectionstatechange = () => console.log('[net] ice ' + pc.iceConnectionState);
      const wire = (ch) => {
        ch.binaryType = 'arraybuffer';
        if (ch.label === 'ctl') {
          ctl = ch; ch.onmessage = (e) => onCtl(e.data);
          const open = () => { if (!relay) console.log('[net] direct connection'); onConnected(); };
          if (ch.readyState === 'open') open(); else ch.onopen = open;
        }
        else { inp = ch; ch.onmessage = (e) => onGamePacket(e.data); }
      };
      if (isHost) {
        wire(pc.createDataChannel('ctl', { ordered: true }));
        wire(pc.createDataChannel('in', { ordered: false, maxRetransmits: 0 }));
        pc.createOffer().then((o) => pc.setLocalDescription(o)).then(() => ws.send(JSON.stringify({ t: 'signal', data: { sdp: pc.localDescription } })));
      } else pc.ondatachannel = (e) => wire(e.channel);
      setTimeout(() => { if (!connected && !error) { relay = true; console.log('[net] through the room server'); say(L.relay); onConnected(); } }, 8000);
    }
    // One setup message at a time, in order: a network address that arrives while the offer or answer is still being
    // applied would otherwise be refused, and without them the direct connection fails (and play goes through the server).
    let signals = Promise.resolve();
    function onSignal(d) { signals = signals.then(() => applySignal(d)).catch((e) => console.log('[net] setup: ' + e)); }
    async function applySignal(d) {
      if (d.sdp) {
        await pc.setRemoteDescription(d.sdp);
        if (d.sdp.type === 'offer') { await pc.setLocalDescription(await pc.createAnswer()); ws.send(JSON.stringify({ t: 'signal', data: { sdp: pc.localDescription } })); }
      } else if (d.ice) { try { await pc.addIceCandidate(d.ice); } catch (e) {} }
    }
    let pings = 0;
    function onConnected() {
      if (connected) return;
      connected = true;
      setInterval(() => sendCtl({ t: 'ping', ts: performance.now() }), 1000);
      if (isHost) for (let k = 0; k < 5; k++) setTimeout(() => sendCtl({ t: 'ping', ts: performance.now() }), k * 150);
    }
    function onCtl(raw) {
      const m = JSON.parse(raw);
      if (m.t === 'ping') sendCtl({ t: 'pong', ts: m.ts });
      else if (m.t === 'pong') {
        const r = performance.now() - m.ts; rtt = rtt ? rtt * 0.8 + r * 0.2 : r;
        if (live) { foot = `${L.live(isHost ? 1 : 2)} ${L.ping} ${Math.round(rtt)} ms`; draw(); }
        // The host picks the delay from the first round trips: a frame's input must cross before the frame plays.
        if (isHost && !live && ++pings === 5) {
          const d = Math.max(3, Math.min(12, Math.ceil(rtt / 2 / (1000 / 60)) + 3));
          sendCtl({ t: 'go', delay: d }); go(d);
        }
      } else if (m.t === 'go') go(m.delay);
    }
    function go(d) {
      const M = game();
      if (!M) {
        // The game's code still loading: begin once it is there (its frame 0 waits for this).
        if (typeof Module !== 'undefined' && !Module._n64web_net_begin && Module.calledRun) { say(L.nogame, true); return; }
        setTimeout(() => go(d), 200); return;
      }
      delay = d; remoteNext = d; live = true;
      M._n64web_net_begin(isHost ? 0 : 1, d);
      foot = L.live(isHost ? 1 : 2); body = ''; head = ''; draw();
      setInterval(() => { if (live && performance.now() - lastSend > 50) sendInputs(); }, 50);
    }
    window.addEventListener('DOMContentLoaded', connectServer);
    if (document.readyState !== 'loading') connectServer();
  })();
</script>

<script>
  // Touch controls: on a touch screen the page adds a virtual standard gamepad (index 0) in front of the real ones;
  // the game opens it like any controller. Buttons follow the standard layout the game's bindings use: A b0, B b1,
  // L b4, R b5, Z b6, START b9, D-pad b12..15, the stick on axes 0/1, the C buttons on the right stick (axes 2/3).
  (function () {
    if (!(matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window || new URLSearchParams(location.search).has('touch'))) return;
    document.body.classList.add('n64-touch');
    // This exact id gets SDL's standard web mapping (START on button 9, tested); other names got a guessed one.
    const pad = { id: 'Fake Standard Gamepad (Vendor: 045e Product: 028e)', index: 0, connected: true, mapping: 'standard', timestamp: performance.now(),
                  axes: [0, 0, 0, 0], vibrationActuator: null,
                  buttons: Array.from({ length: 17 }, () => ({ pressed: false, touched: false, value: 0 })) };
    // Plugged in on the first touch, like a pad connected while the game runs: the game's SDL then gives it its standard
    // mapping (a pad already there when SDL starts gets a different, guessed one).
    const realPads = navigator.getGamepads ? navigator.getGamepads.bind(navigator) : () => [];
    const announce = () => {
      navigator.getGamepads = () => [pad, ...Array.from(realPads()).filter(Boolean)].concat([null, null, null]).slice(0, 4);
      window.dispatchEvent(Object.assign(new Event('gamepadconnected'), { gamepad: pad }));
    };
    const touched = () => { pad.timestamp = performance.now(); };
    let announced = false;
    document.querySelectorAll('#n64-touch [data-b], #n64-touch [data-x]').forEach((el) => {
      const set = (on) => {
        if (!announced) { announced = true; announce(); }
        el.classList.toggle('on', on);
        if (el.dataset.b) pad.buttons[+el.dataset.b] = { pressed: on, touched: on, value: on ? 1 : 0 };
        else pad.axes[+el.dataset.x] = on ? +el.dataset.v : 0;
        touched();
      };
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (x) {} set(true); });
      el.addEventListener('pointerup', () => set(false));
      el.addEventListener('pointercancel', () => set(false));
    });
    const stick = document.getElementById('n64-stick'), knob = document.getElementById('n64-knob');
    const moveStick = (e) => {
      const r = stick.getBoundingClientRect(), max = r.width / 2;
      let x = e.clientX - (r.left + max), y = e.clientY - (r.top + max);
      const len = Math.hypot(x, y); if (len > max) { x *= max / len; y *= max / len; }
      pad.axes[0] = x / max; pad.axes[1] = y / max; touched();
      knob.style.transform = `translate(${x}px, ${y}px)`;
    };
    stick.addEventListener('pointerdown', (e) => {
      e.preventDefault(); try { stick.setPointerCapture(e.pointerId); } catch (x) {}
      if (!announced) { announced = true; announce(); }
      moveStick(e);
    });
    stick.addEventListener('pointermove', (e) => { if (stick.hasPointerCapture(e.pointerId)) moveStick(e); });
    const release = () => { pad.axes[0] = 0; pad.axes[1] = 0; knob.style.transform = ''; touched(); };
    stick.addEventListener('pointerup', release); stick.addEventListener('pointercancel', release);
  })();
</script>
